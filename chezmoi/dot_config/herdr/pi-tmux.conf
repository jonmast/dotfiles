# Minimal tmux config for the herdr pi-assist popup.
# Loaded only by the dedicated `-L herdr` server, so ~/.tmux.conf never applies.

set -g status off
set -g mouse on
set -sg escape-time 0
set -g focus-events on
set -g allow-passthrough all
set -ga terminal-overrides ",*256color:Tc"

# tmux only requests extended keys from herdr if the terminal advertises extkeys,
# which the built-in xterm* feature set omits. pi needs them.
set -as terminal-features ",xterm*:extkeys"
set -s extended-keys always
# Loading any -f config flips this default to xterm, so pin it.
set -s extended-keys-format csi-u
set -g history-limit 50000

# Mirror herdr's prefix so ctrl+a a closes the popup with the chord that opened it.
# Only reachable when the popup is open, which is when herdr forwards keys here.
unbind-key C-b
set -g prefix C-a
bind-key a detach-client
bind-key C-a send-prefix
